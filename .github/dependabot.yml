version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(ci)'
    labels: ['dependencies']

  # Enabled as the ecosystems land in Phase 0.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    labels: ['dependencies', 'rust']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: 'chore(deps)'
    labels: ['dependencies', 'javascript']
    groups:
      # These move together; separate PRs for each would be noise.
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom', 'react-aria-components']
      tanstack:
        patterns: ['@tanstack/*']
      tauri:
        patterns: ['@tauri-apps/*']
