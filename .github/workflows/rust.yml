name: Rust

on:
  push:
    branches: [main]
    paths: ['**.rs', '**/Cargo.toml', 'Cargo.lock', 'clippy.toml', 'rust-toolchain.toml', 'deny.toml', 'packages/tokens/**', 'assets/identity/**', 'apps/shell/**', 'apps/web/public/**', '.github/workflows/rust.yml']
  pull_request:
    paths: ['**.rs', '**/Cargo.toml', 'Cargo.lock', 'clippy.toml', 'rust-toolchain.toml', 'deny.toml', 'packages/tokens/**', 'assets/identity/**', 'apps/shell/**', 'apps/web/public/**', '.github/workflows/rust.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml pins the version; this action honours it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # apps/shell is a Tauri crate, so the whole workspace now needs the Linux webview stack
      # to type-check. The alternative — excluding the shell from the workspace checks — would
      # mean the crate most likely to break is the one nothing lints.
      - name: Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y             libwebkit2gtk-4.1-dev             libayatana-appindicator3-dev             librsvg2-dev             libxdo-dev             libssl-dev             patchelf

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      # The palette gate. A colour pair that cannot be read fails the build here rather than
      # being noticed by a user, which is the only way a contrast rule survives a deadline.
      - name: Design tokens are readable
        run: cargo run -p drevigen-tokens -- check

      # The generated files are committed so a colour change is visible in a pull request.
      # If regenerating moves them, the commit is stale.
      # `git diff` cannot see an untracked file, so this gate was vacuous while the output
      # directory was still git-ignored: it regenerated the files and compared them against
      # nothing. `status --porcelain` catches modified and untracked alike.
      - name: Generated tokens are up to date
        run: |
          cargo run -p drevigen-tokens -- generate
          changed=$(git status --porcelain -- packages/tokens/dist)
          if [ -n "$changed" ]; then
            echo "::error::packages/tokens/dist is stale or untracked. Run: cargo run -p drevigen-tokens -- generate"
            echo "$changed"
            exit 1
          fi

      # The icons are generated and committed for the same reason the tokens are: a change to
      # the mark should be visible in a pull request rather than appearing at release time.
      #
      # Only the SVGs are compared. They are text and byte-identical everywhere; the PNGs are
      # rasterised, and holding a rasteriser to byte equality across operating systems is how
      # a gate becomes a flake. Every PNG is derived from an SVG, so nothing escapes this.
      - name: Generated icons are up to date
        run: |
          cargo run -p drevigen-mark --features render -- assets/identity apps/web/public
          changed=$(git status --porcelain -- assets/identity apps/web/public | grep '\.svg$' || true)
          if [ -n "$changed" ]; then
            echo "::error::The mark changed but its files were not regenerated. Run: cargo run -p drevigen-mark --features render -- assets/identity apps/web/public"
            echo "$changed"
            exit 1
          fi

      - name: Documentation builds without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features

  supply-chain:
    name: Licences and advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # cargo-deny is the single source of truth for supply-chain policy: licences, bans,
      # sources and advisories. rustsec/audit-check was tried and dropped — it needs
      # `checks: write`, and it would re-report the unmaintained crates deny.toml acknowledges
      # with dated reasons, so the two tools would disagree about the same graph.
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check licences, bans, sources and advisories
        run: cargo deny check
