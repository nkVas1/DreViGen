name: Rust

on:
  push:
    branches: [main]
    paths: ['**.rs', '**/Cargo.toml', 'Cargo.lock', 'clippy.toml', 'rust-toolchain.toml', 'deny.toml', 'packages/tokens/**', '.github/workflows/rust.yml']
  pull_request:
    paths: ['**.rs', '**/Cargo.toml', 'Cargo.lock', 'clippy.toml', 'rust-toolchain.toml', 'deny.toml', 'packages/tokens/**', '.github/workflows/rust.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml pins the version; this action honours it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      # The palette gate. A colour pair that cannot be read fails the build here rather than
      # being noticed by a user, which is the only way a contrast rule survives a deadline.
      - name: Design tokens are readable
        run: cargo run -p drevigen-tokens -- check

      # The generated files are committed so a colour change is visible in a pull request.
      # If regenerating moves them, the commit is stale.
      - name: Generated tokens are up to date
        run: |
          cargo run -p drevigen-tokens -- generate
          if ! git diff --quiet -- packages/tokens/dist; then
            echo "::error::packages/tokens/dist is stale. Run: cargo run -p drevigen-tokens -- generate"
            git diff --stat -- packages/tokens/dist
            exit 1
          fi

      - name: Documentation builds without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features

  supply-chain:
    name: Licences and advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # cargo-deny is the single source of truth for supply-chain policy: licences, bans,
      # sources and advisories. rustsec/audit-check was tried and dropped — it needs
      # `checks: write`, and it would re-report the unmaintained crates deny.toml acknowledges
      # with dated reasons, so the two tools would disagree about the same graph.
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check licences, bans, sources and advisories
        run: cargo deny check
