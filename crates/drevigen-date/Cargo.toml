[package]
name = "drevigen-date"
description = "Genealogical dates: four calendars, uncertainty, interval arithmetic, three-valued temporal logic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# No dependencies, deliberately. This crate is compiled into the WASM bundle, where every
# kilobyte is in front of the first paint (ADR 0007), and there is no date library to depend
# on anyway: the requirements in docs/01-research/data-standards.md §3 are not what
# general-purpose date libraries are for.
[dependencies]

# The round-trip and never-loses-text checks draw thousands of values from a seeded generator.
# The testkit has no dependencies of its own and never reaches a release build.
[dev-dependencies]
drevigen-testkit = { version = "0.0.0", path = "../drevigen-testkit" }

[lints]
workspace = true
