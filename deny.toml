# cargo-deny — https://embarkstudios.github.io/cargo-deny/
#
# The project guidelines are explicit: every dependency must be MIT, Apache-2.0, BSD or an
# equivalent permissive licence, and none may require payment to function. A copyleft crate
# arriving transitively would change DreViGen's own obligations without anyone noticing, so the
# build fails on one rather than leaving it to review.

[graph]
all-features = true

[licenses]
# Permissive licences only. AGPL-3.0 is DreViGen's own licence, not one we accept inbound:
# a GPL-family dependency would constrain how the core can be linked into the WASM and mobile
# builds, which is precisely the freedom the architecture depends on.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "MPL-2.0",          # file-level copyleft only; does not reach our code
    "BSL-1.0",
    "OFL-1.1",          # fonts
]
confidence-threshold = 0.9

# The allow list is a policy statement, not an inventory of what today's dependency graph
# happens to contain, so a permitted licence nobody currently uses is not a finding.
unused-allowed-license = "allow"

# This policy governs what we take *in*. DreViGen's own crates are AGPL-3.0 by design, and they
# are unpublished, so cargo-deny's `private` mechanism is the right escape hatch: it exempts
# workspace crates marked `publish = false` and nothing else. A third-party AGPL crate is still
# rejected, which is the point.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
yanked = "deny"

# Each entry is a specific, dated acknowledgement — not a blanket downgrade of `unmaintained`.
# A new unmaintained crate entering the graph still fails the build, which is the behaviour we
# want: every entry below is known and tracked, the next one would not be.
#
# None is a vulnerability; all are `unmaintained`. They arrive in two clusters, and in both the
# crate that pulls them in is a dependency we have chosen deliberately and cannot patch from
# here:
#
#   - `im` and its two children are a mandatory runtime dependency of loro-internal (ADR 0006).
#   - The `unic-*` family arrives through urlpattern, which tauri-utils uses to match the
#     capability scopes; `proc-macro-error` arrives through gtk, which only Linux builds reach.
#     Both are Tauri's to replace, and both are build-time or parsing code rather than anything
#     that touches archive data.
#
# Revisit whenever Loro or Tauri is upgraded.
ignore = [
    { id = "RUSTSEC-2026-0248", reason = "im 15.1.0 — archived; mandatory runtime dep of loro-internal. Upstream's to replace. Reviewed 2026-09-21." },
    { id = "RUSTSEC-2026-0251", reason = "sized-chunks 0.6.5 — archived; pulled in by im. Reviewed 2026-09-21." },
    { id = "RUSTSEC-2026-0247", reason = "bitmaps 2.1.0 — archived; pulled in by im. Reviewed 2026-09-21." },
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill 1.0.3 — archived; target-gated, absent from our host builds. Re-check when the WASM target lands. Reviewed 2026-09-21." },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error 1.0.4 — unmaintained; build-time only, via glib-macros -> gtk -> muda/tao, so Linux builds only. Tauri's to replace. Reviewed 2026-09-22." },
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range 0.9.0 — unmaintained; via urlpattern -> tauri-utils. Reviewed 2026-09-22." },
    { id = "RUSTSEC-2025-0080", reason = "unic-common 0.9.0 — unmaintained; via urlpattern -> tauri-utils. Reviewed 2026-09-22." },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property 0.9.0 — unmaintained; via urlpattern -> tauri-utils. Reviewed 2026-09-22." },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version 0.9.0 — unmaintained; via urlpattern -> tauri-utils. Reviewed 2026-09-22." },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident 0.9.0 — unmaintained; via urlpattern -> tauri-utils. Reviewed 2026-09-22." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
